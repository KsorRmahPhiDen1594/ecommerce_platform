spring.application.name=be

# ==============================
# 🚀 PostgreSQL Database Config
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/highlandscoffee_web
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# ⚙️ JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# 🔐 Security Config (cố định tài khoản admin)
# ==============================
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# spring.security.user.name=admin
# spring.security.user.password=admin123
# spring.security.user.roles=ADMIN

# ==============================
# 🧾 Logging
# ==============================
logging.level.org.springframework.security=DEBUG
logging.level.com.example.be=DEBUG
logging.level.com.example.be.security=DEBUG

# ==============================
# 🌐 Encoding (UTF-8)
# ==============================
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.http.encoding.charset=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
